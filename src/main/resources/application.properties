spring.application.name=ServicioDeConsultas
server.port=${PORT:8085}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/donatrack}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}

#Exchange y Cola de Trabajo
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:donatrack.exchange}
app.rabbitmq.queue=${RABBITMQ_QUEUE:donatrack.eventos}
app.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:#}

# Actuator & Logging
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.root=WARN
logging.level.ar.edu.utn.dds.k3003=INFO
