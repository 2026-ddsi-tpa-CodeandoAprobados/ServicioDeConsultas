spring.application.name=ServicioDeConsultas
server.port=${PORT:8085}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/donatrack}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}

#Exchange y Cola de Trabajo
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:donatrack.exchange}
app.rabbitmq.queue=${RABBITMQ_QUEUE:donatrack.eventos}
app.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:#}

# Actuator & Logging
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Métricas a Datadog (Micrometer). La clave se pasa por DD_API_KEY y nunca se escribe acá.
# Apagado por defecto: activo y sin clave, la app arranca igual pero cada envío a Datadog falla.
management.datadog.metrics.export.enabled=${DD_ENABLED:false}
management.datadog.metrics.export.api-key=${DD_API_KEY:}
management.datadog.metrics.export.uri=${DD_URI:https://api.datadoghq.com}
management.datadog.metrics.export.step=${DD_STEP:30s}
management.metrics.tags.application=consultas
logging.level.root=WARN
logging.level.ar.edu.utn.dds.k3003=INFO

# DELETE /consultas/admin/reset y POST /consultas/admin/seed-demo (sin autenticación): apagados salvo
# ADMIN_ENABLED=true. Apagados responden 403.
app.admin.enabled=${ADMIN_ENABLED:false}

# Consulta 4: cuántos donadores devuelve el ranking de quejas si no se pasa ?limite=
app.consultas.ranking-limite=${CONSULTAS_RANKING_LIMITE:10}
